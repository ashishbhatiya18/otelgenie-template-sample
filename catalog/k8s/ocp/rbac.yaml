#! otelgenie component=ocp signal=any targets=k8s role=manifest category=Kubernetes title="OpenShift: a service account that lets the collectors read nodes, pods and events"

apiVersion: v1
kind: ServiceAccount
metadata:
  name: otelgenie-collector
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otelgenie-collector
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/stats, nodes/proxy, nodes/metrics, pods, namespaces, services, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
  # The openshift detector reads the cluster's infrastructure record.
  - apiGroups: [config.openshift.io]
    resources: [infrastructures, infrastructures/status]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otelgenie-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otelgenie-collector
subjects:
  - kind: ServiceAccount
    name: otelgenie-collector
    namespace: observability
---
# Reading other pods' log files from the node needs the privileged
# security context constraint on OpenShift.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otelgenie-collector-privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: otelgenie-collector
    namespace: observability
