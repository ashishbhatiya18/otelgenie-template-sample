#! otelgenie component=app signal=traces targets=k8s collector=node category=Applications title="Application traces, sent by auto-instrumented pods over OTLP"
#! needs handout=annotation note="Applications are instrumented only where their owner asks for it. Give the application owner this: add the annotation instrumentation.opentelemetry.io/inject-java: observability/otelgenie to the pod template (use inject-python for a Python application; a Go application takes inject-go plus instrumentation.opentelemetry.io/otel-go-auto-target-exe naming its binary), then restart the workload."
#! docs otlp=https://github.com/open-telemetry/opentelemetry-collector/tree/v0.162.0/receiver/otlpreceiver

receivers:
  otlp/app:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

service:
  pipelines:
    traces/app:
      receivers: [otlp/app]
      processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
      exporters: [otlphttp]
