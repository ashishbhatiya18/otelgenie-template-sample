#! otelgenie component=aerospike signal=metrics targets=vm category=Databases title="Aerospike metrics, scraped from aerospike-prometheus-exporter"
#! discover unit=aerospike
#! discover port=3000
#! discover port=9145 -> AEROSPIKE_EXPORTER_ENDPOINT as=localhost:{port} help="host:port where aerospike-prometheus-exporter is listening"
#! needs exporter=aerospike-prometheus-exporter port=9145 owner="the Aerospike owner" note="aerospike-prometheus-exporter must be running next to the Aerospike node. Ask the Aerospike owner to install it and confirm the port."
#! docs prometheus=https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/v0.162.0/receiver/prometheusreceiver

receivers:
  prometheus/aerospike:
    config:
      scrape_configs:
        - job_name: aerospike
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:AEROSPIKE_EXPORTER_ENDPOINT:-localhost:9145}"]

service:
  pipelines:
    metrics/aerospike:
      receivers: [prometheus/aerospike]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlphttp]
