#! otelgenie component=keycloak signal=metrics targets=vm category=Platforms title="Keycloak metrics, scraped from its own metrics endpoint"
#! discover unit=keycloak
#! discover port=9000 -> KEYCLOAK_METRICS_ENDPOINT as=localhost:{port} help="host:port of Keycloak's management interface, which serves /metrics"
#! needs exporter=keycloak-metrics port=9000 owner="the Keycloak owner" note="Keycloak only serves /metrics when it is started with metrics-enabled=true. Ask the Keycloak owner to set it and confirm the port: 9000 (the management port) from Keycloak 25, the main HTTP port before that. This file scrapes over plain HTTP; if the management interface uses TLS, the scrape needs scheme: https added."
#! docs prometheus=https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/v0.162.0/receiver/prometheusreceiver

receivers:
  prometheus/keycloak:
    config:
      scrape_configs:
        - job_name: keycloak
          scrape_interval: 30s
          metrics_path: /metrics
          static_configs:
            - targets: ["${env:KEYCLOAK_METRICS_ENDPOINT:-localhost:9000}"]

service:
  pipelines:
    metrics/keycloak:
      receivers: [prometheus/keycloak]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlphttp]
