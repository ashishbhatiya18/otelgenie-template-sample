#! otelgenie component=nats signal=metrics targets=vm category=Platforms title="NATS server metrics, scraped from prometheus-nats-exporter"
#! discover unit=nats-server
#! discover port=7777 -> NATS_EXPORTER_ENDPOINT as=localhost:{port} help="host:port where prometheus-nats-exporter is listening"
#! needs exporter=prometheus-nats-exporter port=7777 owner="the NATS owner" note="prometheus-nats-exporter must be running next to the NATS server, reading its monitoring port (http_port, usually 8222). Ask the NATS owner to enable the monitoring port, install the exporter and confirm its port."
#! docs prometheus=https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/v0.162.0/receiver/prometheusreceiver

receivers:
  prometheus/nats:
    config:
      scrape_configs:
        - job_name: nats
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:NATS_EXPORTER_ENDPOINT:-localhost:7777}"]

service:
  pipelines:
    metrics/nats:
      receivers: [prometheus/nats]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlphttp]
