#! otelgenie component=jenkins signal=metrics targets=vm category=Platforms title="Jenkins metrics, scraped from its Prometheus metrics plugin"
#! discover unit=jenkins
#! discover port=8080 -> JENKINS_METRICS_ENDPOINT as=localhost:{port} help="host:port where Jenkins answers HTTP"
#! needs exporter=jenkins-prometheus-plugin port=8080 owner="the Jenkins owner" note="Jenkins serves /prometheus/ only with the Prometheus metrics plugin installed. Ask the Jenkins owner to install it, leave its endpoint open to unauthenticated reads from this server, and confirm the port."
#! docs prometheus=https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/v0.162.0/receiver/prometheusreceiver

receivers:
  prometheus/jenkins:
    config:
      scrape_configs:
        - job_name: jenkins
          scrape_interval: 30s
          metrics_path: /prometheus/
          static_configs:
            - targets: ["${env:JENKINS_METRICS_ENDPOINT:-localhost:8080}"]

service:
  pipelines:
    metrics/jenkins:
      receivers: [prometheus/jenkins]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlphttp]
